global:
  scrape_interval: 15s
  scrape_timeout: 5s
  external_labels:
    owner_id: translator-service
    service: translator-service
rule_files:
  - /etc/aelev/rules.yml
scrape_configs:
  - job_name: translator-service
    metrics_path: /metrics
    static_configs:
      - targets: [translator-api:8096]
remote_write:
  - url: https://localhost:4318/api/v1/write
    protobuf_message: prometheus.WriteRequest
    remote_timeout: 10s
    tls_config:
      ca_file: /run/secrets/telemetry/sender/sender-ca.crt
      cert_file: /run/secrets/telemetry/sender/local-write.crt
      key_file: /run/secrets/telemetry/sender/local-write.key
    queue_config:
      min_shards: 1
      max_shards: 2
      capacity: 5000
      max_samples_per_send: 500
      batch_send_deadline: 5s

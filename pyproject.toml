[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aelev-translation-provider"
version = "0.2.0"
description = "Independent provider behind the AELEV opaque translation port"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "starlette==1.3.1",
    "uvicorn==0.35.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pyright = "1.1.414"
pytest = "9.0.3"
ruff = "0.12.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["docs/audit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "test", "tools/release_quality_smoke.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

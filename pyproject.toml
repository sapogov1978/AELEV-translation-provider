[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aelev-translator-service"
version = "0.1.0"
description = "AELEV durable Kafka translation service"
requires-python = ">=3.13"
dependencies = [
    "aelev-platform-ui-client==1.1.1",
    "alembic==1.16.5",
    "confluent-kafka==2.11.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary]==3.2.9",
    "PyJWT[crypto]==2.15.1",
    "SQLAlchemy==2.0.43",
    "starlette==1.3.1",
    "uvicorn==0.35.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
aelev-platform-ui-client = {path = "vendor/aelev_platform_ui_client-1.1.1-py3-none-any.whl"}

[tool.poetry.group.dev.dependencies]
pyright = "1.1.414"
pytest = "9.0.3"
ruff = "0.12.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "test"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
stubPath = "typings"

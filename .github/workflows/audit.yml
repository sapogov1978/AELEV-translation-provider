name: audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"
      - name: Install pinned Poetry
        run: python -m pip install poetry==2.2.1
      - name: Install locked dependencies
        run: poetry install --no-root --no-interaction
      - name: Test, lint and type-check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run pyright
          poetry run pytest -q
      - name: Validate Docker test target
        run: docker build --target test .
      - name: Validate runtime image build without credentials or startup
        run: docker build --target runtime .

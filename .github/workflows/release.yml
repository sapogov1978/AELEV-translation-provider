name: release-provider-image

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-provider-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
      - name: Require successful source audit for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/audit.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" > "$RUNNER_TEMP/source-audit-runs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-audit-runs.json').read_text())['workflow_runs']
          assert any(r['head_sha'] == os.environ['GITHUB_SHA'] and r['head_branch'] == 'main' and r['event'] == 'push' and r['conclusion'] == 'success' for r in runs), 'EXACT_RELEASE_SOURCE_AUDIT_REQUIRED'
          PY
      - name: Record hosted runner architecture and capacity
        run: |
          test "$(uname -m)" = "x86_64"
          uname -a
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          no-cache-filters: python-bookworm
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sapogov1978/aelev-translation-provider:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Scan native released image and verify scoped applicability
        env:
          IMAGE: ghcr.io/sapogov1978/aelev-translation-provider@${{ steps.build.outputs.digest }}
        run: |
          security_dir="$RUNNER_TEMP/provider-security"
          mkdir -p "$security_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz --output "$security_dir/trivy.tar.gz"
          printf '%s  %s\n' 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0' "$security_dir/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$security_dir/trivy.tar.gz" -C "$security_dir" trivy
          docker pull --platform linux/amd64 "$IMAGE"
          scan_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          "$security_dir/trivy" image --no-progress --image-src docker --scanners vuln --exit-code 0 --timeout 10m --format json --list-all-pkgs --output "$security_dir/vulnerabilities-amd64.json" "$scan_image_id"
          python3 tools/runtime_surface_probe.py --image "$IMAGE" --scan "$security_dir/vulnerabilities-amd64.json" --output "$security_dir/security-amd64.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: image-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/provider-security/vulnerabilities-amd64.json
            ${{ runner.temp }}/provider-security/security-amd64.json
          if-no-files-found: error
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/sapogov1978/aelev-translation-provider@$DIGEST"
      - name: Record release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/sapogov1978/aelev-translation-provider@$DIGEST" > release-digest.txt
          printf '### Translation provider image\n\n`%s`\n' "ghcr.io/sapogov1978/aelev-translation-provider@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-digest-${{ github.sha }}
          path: release-digest.txt
          if-no-files-found: error

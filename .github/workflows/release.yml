name: release-provider-image

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-provider-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, aelev-provider-release]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/sapogov1978/aelev-translation-provider:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3
        with:
          cosign-release: v3.1.3
      - name: Sign exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/sapogov1978/aelev-translation-provider@$DIGEST"
      - name: Record release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/sapogov1978/aelev-translation-provider@$DIGEST" > release-digest.txt
          printf '### Translation provider image\n\n`%s`\n' "ghcr.io/sapogov1978/aelev-translation-provider@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-digest-${{ github.sha }}
          path: release-digest.txt
          if-no-files-found: error

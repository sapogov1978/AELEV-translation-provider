name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_COMPOSE_PROJECT:-aelev-infrastructure-translator}

x-image: &image
  image: ${AELEV_INFRASTRUCTURE_TRANSLATOR_IMAGE:-aelev/translator-service:local}
  build:
    context: ${AELEV_INFRASTRUCTURE_TRANSLATOR_BUILD_CONTEXT:-.}
    target: translator-runtime

x-environment: &environment
  AELEV_ENVIRONMENT: ${AELEV_INFRASTRUCTURE_TRANSLATOR_ENVIRONMENT:-local}
  AELEV_TRANSLATOR_DATABASE_URL: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_URL:-}
  AELEV_KAFKA_BOOTSTRAP_SERVERS: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_BOOTSTRAP_SERVERS:?set the Kafka bootstrap servers}
  AELEV_KAFKA_SECURITY_PROTOCOL: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  AELEV_KAFKA_CA_PATH: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_CA_PATH:-}
  AELEV_KAFKA_CLIENT_CERT_PATH: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_CLIENT_CERT_PATH:-}
  AELEV_KAFKA_CLIENT_KEY_PATH: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_CLIENT_KEY_PATH:-}
  AELEV_TRANSLATOR_SOCKET_PATH: /run/aelev-translator/translator.sock

x-role: &role
  <<: *image
  environment: *environment
  depends_on:
    translator-migrator: {condition: service_completed_successfully}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.25
  networks: [translator-data, events]

services:
  translator-migrator:
    <<: *image
    command: ["alembic", "upgrade", "head"]
    environment: *environment
    restart: "no"
    networks: [translator-data]

  translator-model:
    <<: *image
    command: ["python", "-m", "translator_service.madlad_translation_provider", "serve"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    environment:
      AELEV_TRANSLATOR_BATCH_SIZE: "1"
      AELEV_TRANSLATOR_REQUEST_TIMEOUT_SECONDS: "240"
      AELEV_TRANSLATOR_SEGMENT_TIMEOUT_SECONDS: "180"
    volumes: [translator-model-socket:/run/aelev-translator]
    network_mode: none
    mem_limit: ${AELEV_INFRASTRUCTURE_TRANSLATOR_MODEL_MEMORY:-4g}
    cpus: ${AELEV_INFRASTRUCTURE_TRANSLATOR_MODEL_CPUS:-2}
    healthcheck:
      test: ["CMD", "python", "-m", "translator_service.translator_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30

  translator-consumer:
    <<: *role
    command: ["python", "-m", "translator_service.runtime", "consumer"]

  translator-worker:
    <<: *role
    command: ["python", "-m", "translator_service.runtime", "worker"]
    volumes: [translator-model-socket:/run/aelev-translator:ro]
    networks: [translator-data]
    depends_on:
      translator-migrator: {condition: service_completed_successfully}
      translator-model: {condition: service_healthy}
    stop_grace_period: 250s

  translator-outbox:
    <<: *role
    command: ["python", "-m", "translator_service.runtime", "outbox"]

volumes:
  translator-model-socket:

networks:
  translator-data:
    name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_DATABASE_NETWORK:-aelev-infrastructure-translator-database}
    external: ${AELEV_INFRASTRUCTURE_TRANSLATOR_NETWORKS_EXTERNAL:-false}
  events:
    name: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_NETWORK:-aelev-infrastructure-translator-kafka}
    external: ${AELEV_INFRASTRUCTURE_TRANSLATOR_NETWORKS_EXTERNAL:-false}

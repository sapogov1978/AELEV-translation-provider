  AELEV_TRANSLATOR_TOPIC_MAX_MESSAGE_BYTES: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TOPIC_MAX_MESSAGE_BYTES:?set AELEV_INFRASTRUCTURE_TRANSLATOR_TOPIC_MAX_MESSAGE_BYTES in the translator-service .env file}
  AELEV_TRANSLATOR_TOPIC_MIN_INSYNC_REPLICAS: ${AELEV_INFRASTRUCTURE_TRANSLATOR_TOPIC_MIN_INSYNC_REPLICAS:?set AELEV_INFRASTRUCTURE_TRANSLATOR_TOPIC_MIN_INSYNC_REPLICAS in the translator-service .env file}


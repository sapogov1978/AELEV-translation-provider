  AELEV_KAFKA_SECURITY_PROTOCOL: ${AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_SECURITY_PROTOCOL:?set AELEV_INFRASTRUCTURE_TRANSLATOR_KAFKA_SECURITY_PROTOCOL in the translator-service .env file}
